<!-- Fixture for targets-selftest.mjs. Each case is one block holding one
     small link; data-expect says whether the AAA audit must report it. -->
<html lang="en">
<head><meta charset="utf-8"><title>Targets fixture</title>
<style>body{font:16px/1.5 sans-serif} a{color:#1d1d1f}</style></head>
<body><main><h1>Targets</h1>
<p class="case"><a data-expect="exempt" href="#a">sentence</a> link inside running text.</p>
<li class="case">LinkedIn: <a data-expect="exempt" href="#b">linkedin.com/in/x</a></li>
<p class="case"><span>Read <a data-expect="exempt" href="#c">nested</a> here.</span></p>
<p class="case"><a data-expect="flag" href="#d">Learn more ›</a></p>
<p class="case"><a data-expect="flag" href="#e">One ›</a> · <a data-expect="flag" href="#f">Two ›</a></p>
<div class="case"><h3>Card title</h3><a data-expect="flag" href="#g">Card link</a></div>
<p class="case">Text with an <a data-expect="flag" style="display:inline-block" href="#h">inline-block</a> link.</p>
</main></body></html>
