<header class="topbar">
  <div class="topbar-inner">
    <a class="topbar-brand" href="{{locale_path}}" aria-label="{{label_home}}">
      <svg class="brand-logo" viewBox="22 22 3557 3557" width="30" height="30" fill="currentColor" aria-hidden="true" focusable="false"><path d="m2440.5 2568.4c-205.03-119.81-331.45-339.61-331.45-578.81 0-179.3 69.75-347.77 196.59-474.48 50.625-50.625 107.86-91.828 169.73-123.47v-398.66c0-498.67-404.17-902.81-902.81-902.81-498.67 0-902.81 404.17-902.81 902.81v401.07c-68.625 9.9844-136.97 20.672-205.31 32.906-101.25 18.141-174.8 106.17-174.8 208.97v1567.4c0 102.8 73.688 190.83 174.8 208.97 675.72 120.94 1366.2 129.8 2044.1 27.703v-606.24l-67.922-68.766v-196.45zm-1477.4-1575.6c0-336.09 273.38-609.48 609.48-609.48 336.09 0 609.48 273.38 609.48 609.48v365.47c-405.43-39.516-813.67-39.516-1218.9 0zm758.23 1774.3h-297.56c-43.031 0-73.547-42.188-59.766-83.109l106.73-318.94c-70.031-53.016-98.297-158.48-22.219-259.03 139.64-106.31 293.34-9.1406 293.34 124.03 0 55.266-26.578 103.92-67.5 134.86l106.73 318.94c13.641 40.922-16.734 83.109-59.766 83.109z"/><path d="m3310.5 1989.6c0-292.92-237.38-530.28-530.28-530.28-292.92 0-530.28 237.38-530.28 530.28 0 222.47 137.11 412.88 331.45 491.62v225.84l67.922 68.766v622.69l91.125 104.06v-881.43c0-18.281 14.766-33.047 33.047-33.047s33.047 14.766 33.047 33.047v881.43l134.16-120.8v-107.86l-34.031-25.172v-65.672l59.062-78.609v-49.781l-63.422-54.562v-65.812l55.828-82.969-64.266-70.312v-74.25h85.359v-225.84c194.34-78.75 331.45-269.02 331.45-491.62zm-535.07 18.562c-98.156 0-177.89-79.594-177.89-177.89 0-98.156 79.594-177.89 177.89-177.89 98.156 0 177.89 79.594 177.89 177.89 0 98.156-79.594 177.89-177.89 177.89z"/></svg>
      <span class="brand-word">{{name}}</span>
      <span class="brand-badge">2.3.1</span>
    </a>

    <!-- Always present; skeletonic hides it from 64em up. -->
    <button class="topbar-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="navMenu">
      <span class="visually-hidden">{{label_menu}}</span>
      <span class="topbar-toggle-icon" aria-hidden="true"></span>
    </button>

    <div class="topbar-panel" id="navMenu">
      <nav class="topbar-nav" aria-label="{{label_nav}}">
        <ul class="topbar-links">
          <li><a class="topbar-link" href="{{locale_path}}#generator">{{nav_generator}}</a></li>
          <li><a class="topbar-link" href="{{locale_path}}#manifesto">{{nav_why}}</a></li>
          <li><a class="topbar-link" href="{{locale_path}}#architecture">{{nav_modes}}</a></li>
          <li><a class="topbar-link" href="{{locale_path}}#cli">{{nav_cli}}</a></li>
          <li><a class="topbar-link" href="{{locale_path}}#faq">{{nav_faq}}</a></li>
        </ul>
      </nav>

      <div class="topbar-actions">
        <details class="ap-lang">
          <summary class="ap-lang-toggle" title="{{label_langs}}">
            <span class="ap-lang-globe">🌐</span>
            <span class="ap-lang-current">{{lang_code}}</span>
            <span class="visually-hidden">, {{lang_change}}</span>
          </summary>
          <div class="ap-lang-menu">
            <div class="ap-lang-menu-grid">
              <a class="ap-lang-item" href="{{base_path}}?lang=en" hreflang="en" lang="en"{{!en_current}}>English</a>
              <a class="ap-lang-item" href="{{base_path}}fr/?lang=fr" hreflang="fr" lang="fr"{{!fr_current}}>Français</a>
            </div>
          </div>
        </details>

        <!-- Search trigger slot; the generator replaces it with its button. -->
        <span data-ssg-search></span>

        <button class="theme-toggle" id="mode-toggle" type="button" data-label-light="{{label_theme_light}}" data-label-dark="{{label_theme_dark}}">
          <span class="visually-hidden">{{label_theme}}</span>
          <span class="visually-hidden" id="mode-state" data-label-system="{{label_theme_system}}">{{label_theme_system}}</span>
          <span class="theme-icon" aria-hidden="true"></span>
        </button>

        <a href="https://example.com/cipher/download" class="topbar-cta" target="_blank" rel="noopener noreferrer" aria-label="{{label_download_aria}}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11 3h2v9.6l3.3-3.3 1.4 1.4-5.7 5.7-5.7-5.7 1.4-1.4 3.3 3.3V3zM4 18h16v2H4z"/></svg>
          <span>{{label_download}}</span>
        </a>
      </div>
    </div>
  </div>
</header>
