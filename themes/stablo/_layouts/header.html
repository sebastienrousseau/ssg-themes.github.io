<header class="masthead">
  <div class="wrap masthead-in">
    <nav class="site-nav nav-left" id="site-nav" aria-label="{{label_nav}}">
      <ul class="nav-list">
        <li><a href="{{locale_path}}"{{!cur_home}}>{{nav_home}}</a></li>
        <li><a href="{{locale_path}}{{slug_archive}}/"{{!cur_archive}}>{{nav_archive}}</a></li>
        <li><a href="{{locale_path}}{{slug_about}}/"{{!cur_about}}>{{nav_about}}</a></li>
        <li><a href="{{locale_path}}{{slug_contact}}/"{{!cur_contact}}>{{nav_contact}}</a></li>
      </ul>
    </nav>

    <a class="brand" href="{{locale_path}}">
      <span class="brand-name">{{name}}</span>
    </a>

    <div class="masthead-tools">
      <button
        class="nav-btn"
        type="button"
        id="nav-toggle"
        aria-expanded="false"
        aria-controls="site-nav"
      >{{label_menu}}</button>
      <!-- Search trigger slot. The generator replaces this element with
           the search button (see SEARCH_SLOT_ATTR in src/plugins/search.rs);
           with no slot the button is position:fixed in the viewport corner
           and cannot align with this header. -->
      <details class="ap-lang">
      <summary class="ap-lang-toggle" title="{{label_langs}}" aria-label="{{lang_code}}, {{lang_change}}">
      <span class="ap-lang-globe" aria-hidden="true">🌐</span>
      <span class="ap-lang-current">{{lang_code}}</span>
      </summary>
      <div class="ap-lang-menu">
      <div class="ap-lang-menu-grid">
      <a class="ap-lang-item" href="{{base_path}}" hreflang="en" lang="en"{{!en_current}}>English</a>
      <a class="ap-lang-item" href="{{base_path}}fr/" hreflang="fr" lang="fr"{{!fr_current}}>Français</a>
      </div>
      </div>
      </details>
      <span data-ssg-search></span>
      <button class="mode-btn" type="button" id="mode-toggle"
              data-label-light="{{label_light}}" data-label-dark="{{label_dark}}">
        <span class="mode-btn-label">{{label_theme}}</span>
        <span class="mode-btn-state" id="mode-state">{{label_theme_system}}</span>
      </button>
    </div>
  </div>
</header>
