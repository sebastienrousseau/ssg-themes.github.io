# Generated from the keys the layouts reference.
#
# Required is exactly the shell contract: the fields the header, footer
# and document metadata need, which every page renders. The per-layout
# keys are optional because a page only supplies the set its own layout
# uses — an about page has no p1_title, and an index has no post_date.
#
# ssg treats an unresolved {{tag}} as a hard error, so a key a layout
# does need still fails the build rather than shipping a literal brace.

[[schemas]]
name = "page"

