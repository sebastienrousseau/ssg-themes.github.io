site_name = "Signal"
site_title = "Signal — revenue intelligence SaaS theme for SSG"
site_description = "A precise AI revenue-intelligence theme with a luminous dashboard composition, modular capabilities and grounded product copy."
base_url = "https://example.com"
language = "en-GB"

content_dir = "themes/signal/content"
template_dir = "themes/signal/_layouts"
output_dir = "public/signal"

# Slugs are translated, not prefixed: `/signal/about/` pairs with
# `/signal/fr/a-propos/`. The pairing comes from `translation_key`,
# not from the path, and validate.py fails the build if a key does
# not resolve in every locale listed here.
[i18n]
default_locale = "en"
locales = ["en", "fr"]
url_prefix = "sub_path"

[agents]
agents_txt = true
ai_plugin = true

[agents.mcp]
enabled = true

[edge_headers]
targets = ["netlify", "cloudflare"]
