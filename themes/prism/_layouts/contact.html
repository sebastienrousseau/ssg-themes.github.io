{{#extends "base"}}
{{#block "main"}}
<section class="page-hero">
  <div class="container hero-copy">
    <p class="eyebrow eyebrow-hero">{{eyebrow}}</p>
    <h1>{{headline}}</h1>
    <p class="lead hero-lead">{{lead}}</p>
  </div>
    <div class="hero-slope" aria-hidden="true"></div>
</section>

<article class="section">
  <div class="container narrow stack">
    <div class="prose">{{!content}}</div>

    <!--
      Posts to a real endpoint supplied by the site owner via the
      `form_action` front-matter field. Shipping `action="#"` would
      silently discard the submission on press.
    -->
    <form class="stack" action="{{form_action}}" method="post">
      <div class="field">
        <label for="cf-name">Your name</label>
        <input id="cf-name" name="name" type="text" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="cf-email">Email address</label>
        <input id="cf-email" name="email" type="email" autocomplete="email" required aria-describedby="cf-email-hint" />
        <p class="hint" id="cf-email-hint">Used only to reply to this enquiry.</p>
      </div>
      <div class="field">
        <label for="cf-message">Message</label>
        <textarea id="cf-message" name="message" required></textarea>
      </div>
      <div class="cta-row">
        <button class="btn btn-primary" type="submit">Send enquiry</button>
      </div>
    </form>
  </div>
</article>
{{/block}}
