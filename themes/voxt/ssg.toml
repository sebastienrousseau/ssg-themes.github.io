site_name = "Voxt"
site_title = "Voxt — Modern Developer & AI Single Page Showcase"
site_description = "A responsive, single-page developer and AI tool landing page theme for Static Site Generator."
base_url = "https://example.com"
language = "en-GB"

content_dir = "themes/voxt/content"
template_dir = "themes/voxt/_layouts"
output_dir = "public/voxt"

# Slugs are translated, not prefixed: `/voxt/about/` pairs with
# `/voxt/fr/a-propos/`. The pairing comes from `translation_key`,
# not from the path, and validate.py fails the build if a key does
# not resolve in every locale listed here.
[i18n]
default_locale = "en"
locales = ["en", "fr"]
url_prefix = "sub_path"

[agents]
agents_txt = true
ai_plugin = true

[agents.mcp]
enabled = true

[edge_headers]
targets = ["netlify", "cloudflare"]
