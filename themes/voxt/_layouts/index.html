{{#extends "base"}}
{{#block "main"}}
<section id="hero" class="hero-section">
  <div class="container hero-container text-center">
    <div class="pill-badge">
      <span class="pill-tag">NEW</span>
      <span class="pill-text">v0.0.4 Unified Release · TMUX IDE · MCP Agent · Worktrees</span>
    </div>
    <h1 class="hero-title">{{headline}}</h1>
    <p class="hero-lead">{{lead}}</p>
    <div class="hero-cta-group">
      <a class="btn btn-primary btn-lg" href="#quickstart">Quick Start</a>
      <a class="btn btn-secondary btn-lg" href="https://github.com/sebastienrousseau/{{name}}" target="_blank" rel="noopener">Star on GitHub</a>
    </div>

    <!-- Realistic Animated Terminal IDE & MCP Session -->
    <figure class="mcp-term">
      <figcaption class="mcp-term-bar">
        <span class="mcp-term-dot dot-red" aria-hidden="true"></span>
        <span class="mcp-term-dot dot-yellow" aria-hidden="true"></span>
        <span class="mcp-term-dot dot-green" aria-hidden="true"></span>
        <span class="mcp-term-title">Terminal · {{name}} stdio &amp; TMUX IDE</span>
      </figcaption>
      <pre class="mcp-term-body"><code><span class="mcp-tl mcp-tl-cmd mcp-tl-typed mcp-tl-t1"><span class="mcp-tl-ps" aria-hidden="true">$ </span>make up</span>
<span class="mcp-tl mcp-tl-out mcp-tl-fade mcp-tl-f2">[OK] {{name}} ready &lt; 500ms · 4-pane TMUX IDE initialized</span>
<span class="mcp-tl mcp-tl-cmd mcp-tl-typed mcp-tl-t3"><span class="mcp-tl-ps" aria-hidden="true">$ </span>claude mcp add {{name}} -- docker exec -i {{name}} /usr/local/bin/mcp-server</span>
<span class="mcp-tl mcp-tl-out mcp-tl-fade mcp-tl-f4">{{name}}-mcp · connected (stdio JSON-RPC 2.0)</span>
<span class="mcp-tl mcp-tl-ask mcp-tl-typed mcp-tl-t5"><span class="mcp-tl-ps" aria-hidden="true">&gt; </span>Spawn ephemeral muxtree worktree and run test suite.</span>
<span class="mcp-tl mcp-tl-out mcp-tl-fade mcp-tl-f6">dispatched: muxtree create feat/ci-verify &amp;&amp; test/run.sh</span>
<span class="mcp-tl mcp-tl-ok mcp-tl-fade mcp-tl-f7">✓ 100% tests passed · rootless UID 1000 · read-only rootfs confirmed</span>
<span class="mcp-tl mcp-tl-caret" aria-hidden="true"></span></code></pre>
    </figure>
  </div>
</section>

<!-- Content sections rendered from Markdown -->
<div class="content-sections">
  {{!content}}
</div>

{{/block}}
