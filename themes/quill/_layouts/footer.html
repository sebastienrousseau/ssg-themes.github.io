<footer class="footer">
  <div class="wrap footer-in">
    <div class="footer-about">
      <p class="footer-name">{{name}}</p>
      <p class="footer-note">{{footer_note}}</p>
    </div>
    <nav class="footer-nav" aria-label="{{label_footer_nav}}">
      <h2 class="footer-h">{{label_sections}}</h2>
      <ul>
        <li><a href="{{locale_path}}">{{nav_home}}</a></li>
        <li><a href="{{locale_path}}{{slug_archive}}/">{{nav_archive}}</a></li>
        <li><a href="{{locale_path}}{{slug_about}}/">{{nav_about}}</a></li>
      </ul>
    </nav>
  </div>
  <div class="wrap footer-legal">
    <p>{{copyright}}</p>
    <p class="footer-credit"><a class="made-with-ssg" href="https://static-site-generator.com/" rel="noopener noreferrer">{{label_made_with}}</a></p>
  </div>
</footer>
