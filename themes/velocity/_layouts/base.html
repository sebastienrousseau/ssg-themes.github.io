<!DOCTYPE html>
<html lang="{{language}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>{{title}}</title>

    <!-- Strict same-origin policy; see README "Security". `form_origin`
         must name your form endpoint or the browser blocks the POST. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'none';
               object-src 'none';
               script-src 'self';
               style-src 'self';
               img-src 'self' data:;
               font-src 'self';
               connect-src 'self';
               manifest-src 'self';
               form-action 'self' {{form_origin}}"
    />


    {{!primary}}
    {{!opengraph}}
    {{!twitter}}
    {{!apple}}
    {{!microsoft}}

    <!-- Absolute URLs: Open Graph consumers do not resolve relative paths. -->
    <meta property="og:image" content="{{site_url}}images/screenshot.png" />
    <meta property="og:image:width" content="1500" />
    <meta property="og:image:height" content="1000" />
    <meta property="og:image:alt" content="{{title}}" />
    <meta name="twitter:image" content="{{site_url}}images/screenshot.png" />

    <link rel="canonical" href="{{permalink}}" />
    <link rel="alternate" hreflang="{{language}}" href="{{permalink}}" />
    <link rel="alternate" hreflang="x-default" href="{{permalink}}" />

    <link rel="alternate" type="application/rss+xml" title="{{name}} — RSS" href="{{base_path}}rss.xml" />
    <link rel="alternate" type="application/atom+xml" title="{{name}} — Atom" href="{{base_path}}atom.xml" />
    <link rel="alternate" type="application/feed+json" title="{{name}} — JSON Feed" href="{{base_path}}feed.json" />
    <link rel="manifest" href="{{base_path}}manifest.json" />
    <link rel="icon" href="{{base_path}}favicon.ico" sizes="any" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <!-- Native cross-document View Transitions. Browsers without support
         ignore the hint and perform an ordinary navigation. -->
    <meta name="view-transition" content="same-origin" />

    <!-- Authored structured data; see README "Structured data". -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "{{site_url}}#website",
            "url": "{{site_url}}",
            "name": "{{name}}",
            "description": "{{description}}",
            "inLanguage": "{{language}}"
          },
          {
            "@type": "WebPage",
            "@id": "{{permalink}}#webpage",
            "url": "{{permalink}}",
            "name": "{{title}}",
            "description": "{{description}}",
            "inLanguage": "{{language}}",
            "isPartOf": { "@id": "{{site_url}}#website" },
            "datePublished": "{{date}}"
          }
        ]
      }
    </script>

    <link rel="stylesheet" href="{{base_path}}styles.css" />
    <script src="{{base_path}}theme-init.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    {{> header}}

    <main id="main">
      {{#block "main"}}{{/block}}
    </main>

    {{> footer}}

    <script src="{{base_path}}main.js" defer></script>
  </body>
</html>
