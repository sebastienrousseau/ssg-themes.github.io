<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{locale_path}}">{{name}}</a>

    <nav class="site-nav" aria-label="{{ui_primary}}">
      <!-- Always present; CSS hides it above 52rem. -->
      <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="navMenu">
        <span class="visually-hidden">Menu</span>
        <svg class="icon-open" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <line x1="3" y1="7" x2="21" y2="7" /><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="17" x2="21" y2="17" />
        </svg>
        <svg class="icon-close" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <line x1="5" y1="5" x2="19" y2="19" /><line x1="19" y1="5" x2="5" y2="19" />
        </svg>
      </button>

      <ul class="nav-menu" id="navMenu">
        <li><a class="nav-link" href="{{locale_path}}{{slug_features}}/" {{#if nav_features}}aria-current="page"{{/if}}>{{ui_features}}</a></li>
        <li><a class="nav-link" href="{{locale_path}}{{slug_specs}}/" {{#if nav_specs}}aria-current="page"{{/if}}>{{ui_specifications}}</a></li>
        <li><a class="nav-link" href="{{locale_path}}{{slug_contact}}/" {{#if nav_contact}}aria-current="page"{{/if}}>Contact</a></li>
      </ul>

      <details class="ap-lang">
      <summary class="ap-lang-toggle" title="{{ui_language}}" aria-label="{{lang_code}}, {{lang_change}}">
      <span class="ap-lang-globe" aria-hidden="true">🌐</span>
      <span class="ap-lang-current">{{lang_code}}</span>
      </summary>
      <div class="ap-lang-menu">
      <div class="ap-lang-menu-grid">
      <a class="ap-lang-item" href="{{base_path}}" hreflang="en" lang="en"{{!en_current}}>English</a>
      <a class="ap-lang-item" href="{{base_path}}fr/" hreflang="fr" lang="fr"{{!fr_current}}>Français</a>
      </div>
      </div>
      </details>
      <span data-ssg-search></span>

      <button class="theme-toggle" id="mode-toggle" type="button"
        data-label-light="{{label_theme_light}}" data-label-dark="{{label_theme_dark}}">
        <span class="visually-hidden">{{label_theme}}</span>
        <span class="visually-hidden" id="mode-state">{{label_theme_system}}</span>
        <svg class="icon-light" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4" /><line x1="12" y1="2" x2="12" y2="5" /><line x1="12" y1="19" x2="12" y2="22" />
          <line x1="2" y1="12" x2="5" y2="12" /><line x1="19" y1="12" x2="22" y2="12" />
        </svg>
        <svg class="icon-dark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      </button>
    </nav>
  </div>
</header>
