site_name = "Visage"
site_title = "Visage — evidence-led aesthetic health theme for SSG"
site_description = "A calm clinical-aesthetics theme with generous whitespace, a centred consultation journey and privacy-first static delivery."
base_url = "https://example.com"
language = "en-GB"

content_dir = "themes/visage/content"
template_dir = "themes/visage/_layouts"
output_dir = "public/visage"

# Slugs are translated, not prefixed: `/visage/about/` pairs with
# `/visage/fr/a-propos/`. The pairing comes from `translation_key`,
# not from the path, and validate.py fails the build if a key does
# not resolve in every locale listed here.
[i18n]
default_locale = "en"
locales = ["en", "fr"]
url_prefix = "sub_path"

[agents]
agents_txt = true
ai_plugin = true

[agents.mcp]
enabled = true

[edge_headers]
targets = ["netlify", "cloudflare"]
