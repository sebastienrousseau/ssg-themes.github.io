<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{locale_path}}">
      <span class="brand-mark" aria-hidden="true">{{short_name}}</span>
      <span class="brand-text">{{name}}</span>
    </a>

    <nav class="site-nav" aria-label="{{ui_primary}}">
      <!-- Always present; CSS hides it above 48rem. -->
      <button
        class="nav-toggle"
        id="navToggle"
        type="button"
        aria-expanded="false"
        aria-controls="navMenu"
      >
        <span class="visually-hidden">Menu</span>
        <svg class="icon-open" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
        <svg class="icon-close" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <line x1="5" y1="5" x2="19" y2="19" />
          <line x1="19" y1="5" x2="5" y2="19" />
        </svg>
      </button>

      <ul class="nav-menu" id="navMenu">
        <li>
          <a class="nav-link" href="{{locale_path}}{{slug_platform}}/" {{#if nav_platform}}aria-current="page"{{/if}}>{{ui_platform}}</a>
        </li>
        <li>
          <a class="nav-link" href="{{locale_path}}{{slug_solutions}}/" {{#if nav_solutions}}aria-current="page"{{/if}}>{{ui_solutions}}</a>
        </li>
        <li>
          <a class="nav-link" href="{{locale_path}}{{slug_pricing}}/" {{#if nav_pricing}}aria-current="page"{{/if}}>Pricing</a>
        </li>
        <li>
          <a class="nav-link" href="{{locale_path}}{{slug_contact}}/" {{#if nav_contact}}aria-current="page"{{/if}}>Contact</a>
        </li>
      </ul>

      <!-- Replaced by the generator with a real switcher on a multi-locale
           site. An element rather than a comment: minifiers strip comments,
           and some pages are minified during generation. -->

      <!-- Icon swapped by CSS on [data-theme]; no scripted relabelling. -->
      <!-- Search trigger slot. The generator replaces this element with
           the search button (see SEARCH_SLOT_ATTR in src/plugins/search.rs);
           with no slot the button is position:fixed in the viewport corner
           and cannot align with this header. -->
      <details class="ap-lang">
      <summary class="ap-lang-toggle" title="{{ui_language}}">
      <span class="ap-lang-globe">🌐</span>
      <span class="ap-lang-current">{{lang_code}}</span>
      <span class="visually-hidden">, {{lang_change}}</span>
      </summary>
      <div class="ap-lang-menu">
      <div class="ap-lang-menu-grid">
      <a class="ap-lang-item" href="{{base_path}}?lang=en" hreflang="en" lang="en"{{!en_current}}>English</a>
      <a class="ap-lang-item" href="{{base_path}}fr/?lang=fr" hreflang="fr" lang="fr"{{!fr_current}}>Français</a>
      </div>
      </div>
      </details>
      <span data-ssg-search></span>
      <button
        class="theme-toggle"
        id="mode-toggle"
        type="button"
        data-label-light="{{label_theme_light}}"
        data-label-dark="{{label_theme_dark}}"
      >
        <span class="visually-hidden">{{label_theme}}</span>
        <span class="visually-hidden" id="mode-state" data-label-system="{{label_theme_system}}">{{label_theme_system}}</span>
        <span class="theme-icon" aria-hidden="true"></span>
      </button>
    </nav>
  </div>
</header>
