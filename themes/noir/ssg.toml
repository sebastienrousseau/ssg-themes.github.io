site_name = "Noir"
site_title = "Noir — monochrome streetwear commerce theme for SSG"
site_description = "A high-contrast streetwear theme with a sculptural product silhouette, hard editorial rules and accessible catalogue storytelling."
base_url = "https://example.com"
language = "en-GB"

content_dir = "themes/noir/content"
template_dir = "themes/noir/_layouts"
output_dir = "public/noir"

# Slugs are translated, not prefixed: `/noir/about/` pairs with
# `/noir/fr/a-propos/`. The pairing comes from `translation_key`,
# not from the path, and validate.py fails the build if a key does
# not resolve in every locale listed here.
[i18n]
default_locale = "en"
locales = ["en", "fr"]
url_prefix = "sub_path"

[agents]
agents_txt = true
ai_plugin = true

[agents.mcp]
enabled = true

[edge_headers]
targets = ["netlify", "cloudflare"]
