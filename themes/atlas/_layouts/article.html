{{#extends "base"}}
{{#block "main"}}
<article class="section">
  <div class="container prose stack">
    <p class="eyebrow">{{eyebrow}}</p>
    <h1>{{headline}}</h1>
    <p class="lead">{{lead}}</p>
    <!-- A machine-readable publication date, paired with the visible one. -->
    <p class="hint">
      Published <time datetime="{{date}}">{{date}}</time> · {{author}}
    </p>
    {{!content}}
  </div>
</article>
{{/block}}
