{{#extends "base"}}
{{#block "main"}}
<article class="section">
  <div class="container narrow stack">
    <p class="eyebrow">{{eyebrow}}</p>
    <h1>{{headline}}</h1>
    <p class="lead">{{lead}}</p>

    <div class="prose">{{!content}}</div>

    <!--
      Posts to a real endpoint supplied by the site owner via the
      `form_action` front-matter field. Shipping `action="#"` would
      silently discard the submission on press.
    -->
    <form class="stack" action="{{form_action}}" method="post">
      <div class="field">
        <label for="cf-name">{{form_name}}</label>
        <input id="cf-name" name="name" type="text" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="cf-email">{{form_email}}</label>
        <input id="cf-email" name="email" type="email" autocomplete="email" required />
        <p class="hint" id="cf-email-hint">{{form_email_hint}}</p>
      </div>
      <div class="field">
        <label for="cf-message">{{form_message}}</label>
        <textarea id="cf-message" name="message" required></textarea>
      </div>
      <div class="cta-row">
        <button class="btn btn-primary" type="submit">{{form_submit}}</button>
      </div>
    </form>
  </div>
</article>
{{/block}}
