<!DOCTYPE html>
<html lang="{{language}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>{{title}}</title>

    <!-- Strict same-origin policy; see README "Security". `form_origin`
         must name your form endpoint or the browser blocks the POST. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'none';
               object-src 'none';
               script-src 'self';
               style-src 'self';
               img-src 'self' data:;
               font-src 'self';
               connect-src 'self';
               manifest-src 'self';
               form-action 'self' {{form_origin}}"
    />


    {{!primary}}
    {{!opengraph}}
    {{!twitter}}
    {{!apple}}
    {{!microsoft}}

    <!-- Absolute URLs: Open Graph consumers do not resolve relative paths.
         `asset_url` is the SITE root, not the locale root — one copy of
         the screenshot is published, under `/atlas/images/`. -->
    <meta property="og:image" content="{{asset_url}}images/screenshot.png" />
    <meta property="og:image:width" content="1500" />
    <meta property="og:image:height" content="1000" />
    <meta property="og:image:alt" content="{{title}}" />
    <meta name="twitter:image" content="{{asset_url}}images/screenshot.png" />

    <link rel="canonical" href="{{permalink}}" />

    <!-- Alternate-language links are injected here by the generator's
         i18n plugin, from the `translation_key` front-matter field —
         that is what pairs /atlas/about/ with /atlas/fr/a-propos/.

         Do not hand-write them. The injector is idempotent: it skips
         any page whose source already contains its marker substring,
         and an alternate-language link written by hand — even one
         quoted inside a comment like this — trips that check and
         silently disables every alternate on the page. -->

    <!-- Feeds, manifest, icon, stylesheet and scripts are published
         once per SITE, so they hang off `asset_path` (the site root)
         rather than `base_path` (the locale root). Under `base_path` a
         French page would ask for `/atlas/fr/styles.css`, which is
         never written. The feeds cover every locale's content. -->
    <link rel="alternate" type="application/rss+xml" title="{{name}} — RSS" href="{{asset_path}}rss.xml" />
    <link rel="alternate" type="application/atom+xml" title="{{name}} — Atom" href="{{asset_path}}atom.xml" />
    <link rel="alternate" type="application/feed+json" title="{{name}} — JSON Feed" href="{{asset_path}}feed.json" />
    <link rel="manifest" href="{{asset_path}}manifest.json" />
    <link rel="icon" href="{{asset_path}}favicon.ico" sizes="any" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <!-- Native cross-document View Transitions. Browsers without support
         ignore the hint and perform an ordinary navigation. -->
    <meta name="view-transition" content="same-origin" />

    <!-- Authored structured data; see README "Structured data". -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "{{site_url}}#website",
            "url": "{{site_url}}",
            "name": "{{name}}",
            "description": "{{description}}",
            "inLanguage": "{{language}}"
          },
          {
            "@type": "WebPage",
            "@id": "{{permalink}}#webpage",
            "url": "{{permalink}}",
            "name": "{{title}}",
            "description": "{{description}}",
            "inLanguage": "{{language}}",
            "isPartOf": { "@id": "{{site_url}}#website" },
            "datePublished": "{{date}}"
          }
        ]
      }
    </script>

    <link rel="stylesheet" href="{{asset_path}}styles.css" />
    <script src="{{asset_path}}theme-init.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#main">{{label_skip}}</a>

    {{> header}}

    <main id="main">
      {{#block "main"}}{{/block}}
    </main>

    {{> footer}}

    <script src="{{asset_path}}main.js" defer></script>
  </body>
</html>
