# Theme manifest. `theme.toml` is the format theme registries read;
# `theme.json` mirrors it for tooling that expects JSON.

name = "Apex"
license = "MIT"
licenselink = "https://github.com/sebastienrousseau/ssg-themes.github.io/blob/main/LICENSE"
description = "Executive portfolio theme: template inheritance, AAA-gated colour tokens, zero third-party requests."
homepage = "https://github.com/sebastienrousseau/ssg-themes.github.io"
demosite = "https://ssg-themes.github.io/apex/"

# Minimum generator version. Below this the build still succeeds but
# renders without the layout resolved from front matter.
min_version = "0.0.49"

tags = ["portfolio","business","consulting","accessibility","dark-mode"]
features = ["dark-mode","search","rss","json-ld","wcag-aa","no-javascript-required","contact-form"]

[[authors]]
name = "SSG Theme Suite"
homepage = "https://github.com/sebastienrousseau"
