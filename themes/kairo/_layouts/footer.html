<footer class="site-footer" id="contact">
  <div class="container footer-grid">
    <div>
      <span class="brand footer-brand"><span class="brand-mark" aria-hidden="true">{{brand_mark}}</span><span>{{name}}</span></span>
      <p>{{footer_note}}</p>
    </div>
    <div>
      <h2>Explore</h2>
      <ul>
        <li><a href="{{site_path}}#services">{{ui_services_2}}</a></li>
        <li><a href="{{site_path}}#work">{{ui_selected_work}}</a></li>
        <li><a href="{{site_path}}about/">About</a></li>
      </ul>
    </div>
    <div>
      <h2>{{ui_start_a_conversation}}</h2>
      <p><a class="footer-action" href="mailto:hello@example.com">{{ui_hello_example_com}}</a></p>
      <p class="fine-print">© {{copyright_year}} {{name}}. Demonstration content.</p>
      <p class="fine-print footer-credit">Made with ❤️ in London. Built with <a href="https://static-site-generator.com/">SSG</a> and <a href="https://skeletonic.com/">Skeletonic CSS</a>.</p>
    </div>
  </div>
</footer>
