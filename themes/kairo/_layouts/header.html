<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{site_path}}" aria-label="{{name}} home">
      <span class="brand-mark" aria-hidden="true">{{brand_mark}}</span>
      <span>{{name}}</span>
    </a>
    <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="navMenu">
      <span>Menu</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
    </button>
    <nav class="site-nav" id="navMenu" aria-label="{{ui_primary}}">
      <a href="{{site_path}}#work">{{ui_projects}}</a>
      <a href="{{site_path}}#services">{{ui_services}}</a>
      <a href="{{site_path}}#process">Process</a>
      <a href="{{site_path}}about/">About</a>
      <a class="nav-cta" href="{{site_path}}#inquiry">Contact</a>
    <details class="ap-lang">
    <summary class="ap-lang-toggle" title="{{ui_language}}">
    <span class="ap-lang-globe">🌐</span>
    <span class="ap-lang-current">{{lang_code}}</span>
    <span class="visually-hidden">, {{lang_change}}</span>
    </summary>
    <div class="ap-lang-menu">
    <div class="ap-lang-menu-grid">
    <a class="ap-lang-item" href="{{base_path}}?lang=en" hreflang="en" lang="en"{{!en_current}}>English</a>
    <a class="ap-lang-item" href="{{base_path}}fr/?lang=fr" hreflang="fr" lang="fr"{{!fr_current}}>Français</a>
    </div>
    </div>
    </details>
      <span class="search-slot" id="search-slot" data-ssg-search></span>
    </nav>
    <button class="theme-toggle" id="mode-toggle" type="button" data-label-light="Light" data-label-dark="Dark">
      <span class="visually-hidden">{{ui_change_colour_theme_system}}</span>
      <span class="visually-hidden" id="mode-state" data-label-system="System">System</span>
        <span class="theme-icon" aria-hidden="true"></span>
    </button>
  </div>
</header>
