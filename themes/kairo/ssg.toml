site_name = "Kairo"
site_title = "Kairo — expressive creative portfolio theme for SSG"
site_description = "A cinematic creative portfolio with oversized type, energetic geometry and an original image-free art direction."
base_url = "https://example.com"
language = "en-GB"

content_dir = "themes/kairo/content"
template_dir = "themes/kairo/_layouts"
output_dir = "public/kairo"

# Slugs are translated, not prefixed: `/kairo/about/` pairs with
# `/kairo/fr/a-propos/`. The pairing comes from `translation_key`,
# not from the path, and validate.py fails the build if a key does
# not resolve in every locale listed here.
[i18n]
default_locale = "en"
locales = ["en", "fr"]
url_prefix = "sub_path"

[agents]
agents_txt = true
ai_plugin = true

[agents.mcp]
enabled = true

[edge_headers]
targets = ["netlify", "cloudflare"]
