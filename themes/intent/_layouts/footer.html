<footer class="site-footer" id="contact">
  <div class="container footer-grid">
    <div>
      <span class="brand footer-brand"><span class="brand-mark" aria-hidden="true">{{brand_mark}}</span><span>{{name}}</span></span>
      <p>{{footer_note}}</p>
    </div>
    <div>
      <h2>{{label_explore}}</h2>
      <ul>
        <li><a href="{{locale_path}}#services">{{nav_services}}</a></li>
        <li><a href="{{locale_path}}#work">{{nav_work_long}}</a></li>
        <li><a href="{{locale_path}}{{slug_about}}/">{{nav_about}}</a></li>
        <li><a href="{{locale_path}}{{slug_contact}}/">{{nav_contact}}</a></li>
      </ul>
    </div>
    <div>
      <h2>{{label_start}}</h2>
      <p><a class="footer-action" href="mailto:hello@example.com">hello@example.com</a></p>
      <p class="fine-print">© {{copyright_year}} {{name}}. {{label_demo_content}}</p>
      <p class="fine-print footer-credit">Made with ❤️ in London. Built with <a href="https://static-site-generator.com/">SSG</a> and <a href="https://skeletonic.com/">Skeletonic CSS</a>.</p>
    </div>
  </div>
</footer>
