# Typed front-matter contract for Lucid.
#
# `ssg` validates every page carrying `schema = "page"` against this at
# compile time. That matters more than usual here: the template engine
# treats an unresolved `{{tag}}` as a hard error, so a layout referencing a
# field no content file defines breaks the build anyway — this schema turns
# that into a named, actionable message instead of a template failure.
#
# The required set is exactly the shell contract: the fields every page
# needs because the base layout, header and footer reference them. Because
# every visible string is a field rather than markup, this list is also the
# translation checklist — a new locale is complete when each of these is
# present in its content files.
#
# The optional set covers the per-layout fields: hero and card copy for the
# index layout, and navigation state, pagination and contents for the doc
# layout. A page using a layout must define that layout's fields.

[[schemas]]
name = "page"

[[schemas.fields]]
name = "author"
type = "string"
required = true

[[schemas.fields]]
name = "base_path"
type = "string"
required = true

