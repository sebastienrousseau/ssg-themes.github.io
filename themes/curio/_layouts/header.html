<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{locale_path}}" aria-label="{{label_home}}">
      <span class="brand-mark" aria-hidden="true">{{brand_mark}}</span>
      <span>{{name}}</span>
    </a>
    <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="navMenu">
      <span>{{label_menu}}</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
    </button>
    <nav class="site-nav" id="navMenu" aria-label="{{label_nav}}">
      <a href="{{locale_path}}#services">{{nav_services}}</a>
      <a href="{{locale_path}}#work">{{nav_work}}</a>
      <a href="{{locale_path}}{{slug_about}}/">{{nav_about}}</a>
      <a href="{{locale_path}}{{slug_contact}}/">{{nav_contact}}</a>
      <a class="nav-cta" href="{{locale_path}}#contact">{{cta_primary}}</a>
    </nav>
    <nav class="lang-nav" aria-label="{{label_langs}}">
      <ul class="lang-list">
        <li><a href="{{base_path}}" hreflang="en" lang="en"{{!en_current}}>English</a></li>
        <li><a href="{{base_path}}fr/" hreflang="fr" lang="fr"{{!fr_current}}>Français</a></li>
      </ul>
    </nav>
    <button class="mode-toggle" id="mode-toggle" type="button" data-label-light="{{label_theme_light}}" data-label-dark="{{label_theme_dark}}" aria-label="{{label_theme}}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41" /></svg>
      <span id="mode-state">{{label_theme_system}}</span>
    </button>
  </div>
</header>
