{{#extends "base"}}
{{#block "main"}}
<!--
  The showcase landing page.

  Everything structural comes from the Apex theme: this file is overlaid onto
  a staged copy of `themes/apex/_layouts/` at build time, so `base`, `header`,
  `footer` and `styles.css` are Apex's own. The gallery's own presentation
  lives in `showcase/layout/showcase.css`, appended to that staged stylesheet
  by scripts/build.sh — never written into `themes/apex/`, which ships to
  users as a downloadable archive and must not carry a carousel that exists
  on one page.

  Apex's palette is already the one this page wants: deep charcoal (#1d1d1f)
  on near-white, and a true black canvas in dark mode.
-->
<div class="showcase">
  <section class="sc-hero" aria-labelledby="hero-heading">
    <div class="container">
      <p class="eyebrow">{{eyebrow}}</p>
      <h1 id="hero-heading">{{headline}}</h1>
      <p class="lead">{{lead}}</p>

      <!--
        Filled in after the build by scripts/facts.py, from the gates that
        produce them. Do not type a number here: the lead promises these are
        generated, and two of them had silently gone stale when they were
        hand-written. facts.py matches `<b data-fact="KEY">…</b>`, so that
        element must survive any edit to this block.
      -->
      <div class="sc-facts">
        <div>
          <b data-fact="tokens">—</b>
          <p>colour token pairs passing AAA contrast, light and dark</p>
        </div>
        <div>
          <b data-fact="a11y">—</b>
          <p>accessibility issues across all theme pages</p>
        </div>
        <div>
          <b data-fact="thirdparty">—</b>
          <p>third-party requests, on every page</p>
        </div>
        <div>
          <b data-fact="heaviest">—</b>
          <p>heaviest page, gzipped, including CSS and JS</p>
        </div>
      </div>
    </div>
  </section>

  {{!content}}
</div>
{{/block}}
