{{#extends "base"}}
{{#block "main"}}
<!--
  The showcase landing page.

  The root is a standalone SSG site. Its base, header, footer, page layouts,
  design system and gallery assets all live together in `showcase/layout/`;
  the build does not borrow or patch a distributable theme.

  Its palette is deep charcoal (#1d1d1f) on near-white, with a true black
  canvas in dark mode.
-->
<div class="showcase">
  <section class="sc-hero" aria-labelledby="hero-heading">
    <div class="container">
      <p class="eyebrow">{{eyebrow}}</p>
      <h1 id="hero-heading">{{headline}}</h1>
      <p class="lead">{{lead}}</p>

      <!--
        Filled in after the build by scripts/facts.py, from the gates that
        produce them. Do not type a number here: the lead promises these are
        generated, and two of them had silently gone stale when they were
        hand-written. facts.py matches `<b data-fact="KEY">…</b>`, so that
        element must survive any edit to this block.
      -->
      <div class="sc-facts">
        <div>
          <b data-fact="tokens">—</b>
          <p>{{stat_tokens}}</p>
        </div>
        <div>
          <b data-fact="a11y">—</b>
          <p>{{stat_a11y}}</p>
        </div>
        <div>
          <b data-fact="thirdparty">—</b>
          <p>{{stat_thirdparty}}</p>
        </div>
        <div>
          <b data-fact="heaviest">—</b>
          <p>{{stat_weight}}</p>
        </div>
      </div>
    </div>
  </section>

  {{!content}}
</div>
{{/block}}
