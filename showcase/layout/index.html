{{#extends "base"}}
{{#block "main"}}
<!--
  The showcase landing page.

  The root is a standalone SSG site built with Static Site Generator and
  Skeletonic CSS. Its base, header, footer, page layouts, design system
  and gallery assets all live together in `showcase/layout/`; the build
  does not borrow or patch a distributable theme.

  Modelled on Apple's homepage (`section-hero` + two-column `section-promo`
  tile grid), its palette is deep charcoal (#1d1d1f) on near-white (#fbfbfd
  / #f5f5f7), with a true black (#000000) canvas in dark mode and on
  dark-staged promo tiles.
-->
<div class="showcase">
  <section class="section section-hero sc-hero" aria-labelledby="hero-heading">
    <div class="tile-wrapper tile-hero">
      <div class="tile-content">
        <div class="tile-copy-wrapper">
          <p class="eyebrow">{{eyebrow}}</p>
          <h1 id="hero-heading" class="tile-headline typography-hero-headline">{{headline}}</h1>
          <p class="tile-subhead typography-hero-subhead lead">{{lead}}</p>
        </div>
        <div class="tile-ctas">
          <a class="button button-elevated" href="#themes-heading">{{nav_label_themes}}</a>
          <a class="button button-elevated button-secondary" href="#gates-heading">{{nav_label_gates}}</a>
          <a class="button button-elevated button-secondary" href="{{repo_url}}" rel="noopener noreferrer">{{nav_label_repo}}</a>
        </div>

        <!--
          Filled in after the build by scripts/facts.py, from the gates that
          produce them. Do not type a number here: the lead promises these are
          generated, and two of them had silently gone stale when they were
          hand-written. facts.py matches `<b data-fact="KEY">…</b>`, so that
          element must survive any edit to this block.
        -->
        <div class="sc-facts">
          <div>
            <b data-fact="tokens">—</b>
            <p>{{stat_tokens}}</p>
          </div>
          <div>
            <b data-fact="a11y">—</b>
            <p>{{stat_a11y}}</p>
          </div>
          <div>
            <b data-fact="thirdparty">—</b>
            <p>{{stat_thirdparty}}</p>
          </div>
          <div>
            <b data-fact="heaviest">—</b>
            <p>{{stat_weight}}</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  {{!content}}
</div>
{{/block}}
