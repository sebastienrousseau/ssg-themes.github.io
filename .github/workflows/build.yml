name: Build and Deploy SSG Themes Showcase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo Source
        uses: actions/checkout@v4

      - name: Install cargo-binstall (Pre-compiled binary manager)
        uses: cargo-bins/cargo-binstall@main

      - name: Fast Install ssg (Pre-compiled Binary)
        run: cargo binstall --no-confirm ssg

      - name: Build All Themes & Gallery Hub
        run: make build-all

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
