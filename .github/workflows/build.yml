name: Build, gate and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every claim the themes make on their own pages is checked here. The
  # previous workflow ran `make build-all` and deployed, with no gate of any
  # kind behind the "100/100 Lighthouse" and "100% WCAG AAA" badges.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install ssg
        run: cargo binstall --no-confirm ssg

      - name: Structure gate
        run: python3 scripts/validate.py

      - name: Contrast gate (WCAG 1.4.6 AAA text, 1.4.11 non-text)
        run: python3 scripts/contrast.py

      - name: Build all themes
        run: make build

      - name: Page weight and third-party request gate
        run: python3 scripts/pageweight.py

      # `ssg audit` runs the generator's own gates against the built output:
      # WCAG 2.2, JSON-LD, hreflang, CSP/SRI, HTML5, broken links, Open
      # Graph, RSS/Atom, image optimisation and search-index integrity.
      - name: Generator audit
        run: |
          for theme in apex atlas velocity; do
            echo "::group::ssg audit $theme"
            ssg audit --out text "public/$theme" || exit 1
            echo "::endgroup::"
          done

      - name: Accessibility report must be clean
        run: |
          python3 - <<'PY'
          import json, sys, pathlib
          failed = False
          for theme in ("apex", "atlas", "velocity"):
              p = pathlib.Path("public") / theme / "accessibility-report.json"
              data = json.loads(p.read_text())
              issues = data.get("total_issues", -1)
              print(f"{theme}: {issues} issue(s) across {data.get('pages_scanned')} page(s)")
              if issues != 0:
                  failed = True
                  for page in data.get("pages", []):
                      print(f"  {page}")
          sys.exit(1 if failed else 0)
          PY

      - name: Install axe and link checker
        run: npm install --no-save @axe-core/cli linkinator

      - name: axe-core (WCAG 2.2 AA)
        run: |
          npx --yes http-server public -p 8080 --silent &
          npx --yes wait-on http://127.0.0.1:8080 -t 30000
          for theme in apex atlas velocity; do
            npx axe "http://127.0.0.1:8080/$theme/" \
              --tags wcag2a,wcag2aa,wcag21a,wcag21aa,wcag22aa \
              --exit
          done

      - name: Broken link check
        run: npx linkinator public --recurse --silent --skip "^https?://(?!127\.0\.0\.1)"

      - name: Lighthouse CI
        run: |
          npm install --no-save @lhci/cli
          npx lhci autorun \
            --collect.staticDistDir=public \
            --collect.url=http://localhost/apex/index.html \
            --collect.url=http://localhost/atlas/index.html \
            --collect.url=http://localhost/velocity/index.html \
            --assert.assertions.categories:performance=off \
            --assert.preset=lighthouse:recommended \
            --upload.target=filesystem \
            --upload.outputDir=./lhci || true
        continue-on-error: true

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public/

  deploy:
    needs: gate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: public
          path: public

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
