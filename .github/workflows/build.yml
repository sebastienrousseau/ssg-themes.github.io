name: Build, gate and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by ssg-version.yml to run this entire gate against a candidate
  # generator release. A version that cannot pass the gate never becomes a
  # pull request.
  workflow_call:
    inputs:
      ssg_version:
        description: Generator version to gate instead of the pinned one.
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # A called run shares the caller's ref, so without the workflow name in
  # the key a version probe on main would cancel an in-flight deploy.
  group: pages-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; a run on main is left to finish so
  # a new push cannot cut a Pages deploy off halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Every claim the themes make on their own pages is checked here. The
  # previous workflow ran `make build-all` and deployed, with no gate of any
  # kind behind the "100/100 Lighthouse" and "100% WCAG AAA" badges.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; keep the token out of .git/config while
          # npm-installed tools run later in this job.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The pin lives in `.github/ssg-version`, not in this file.
      #
      # ssg-version.yml bumps it, and GITHUB_TOKEN is categorically
      # forbidden from pushing changes to anything under
      # `.github/workflows/` — "refusing to allow a GitHub App to create or
      # update workflow ... without `workflows` permission". No permissions
      # setting lifts that; only a PAT would. A plain file the tracker can
      # write keeps the automation credential-free.
      - name: Resolve the generator version
        id: ssg_version
        # The candidate arrives from crates.io via ssg-version.yml. It is
        # read through env, never expanded into the script, and must look
        # like a version before anything uses it.
        env:
          INPUT_VERSION: ${{ inputs.ssg_version }}
        run: |
          version="${INPUT_VERSION}"
          if [[ -z "${version}" ]]; then
            version="$(tr -d '[:space:]' < .github/ssg-version)"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid generator version '${version}'"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          # build.sh and audit.sh hold the binary to this version.
          echo "SSG_EXPECTED_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "building against ssg ${version}"

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2

      - name: Install ssg
        env:
          SSG_VERSION: ${{ steps.ssg_version.outputs.version }}
        run: |
          cargo binstall --no-confirm --disable-strategies compile "ssg@${SSG_VERSION}"
          ssg --version

      - name: Unit tests (HTML rewriting scripts)
        run: make test

      - name: Structure gate
        run: python3 scripts/validate.py

      - name: Contrast gate (WCAG 1.4.6 AAA text, 1.4.11 non-text)
        run: python3 scripts/contrast.py

      - name: Diceware wordlist round-trip (jspassgen, cipher)
        run: node scripts/diceware-wordlist.mjs

      - name: Build all themes
        run: make build

      # Uploaded straight after the build, before any npm-installed tool
      # runs, so a compromised test dependency cannot alter what deploys.
      # Deploy still waits for every gate below: it needs this whole job.
      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public
          path: public/

      - name: Page weight and third-party request gate
        run: python3 scripts/pageweight.py

      - name: Site chrome consistency gate
        run: python3 scripts/chrome.py

      # `ssg audit` runs the generator's own gates against the built output:
      # WCAG 2.2, JSON-LD, hreflang, CSP/SRI, HTML5, broken links, Open
      # Graph, RSS/Atom, image optimisation and search-index integrity.
      - name: Generator audit
        # Mirrors the deployed URL prefix first; auditing public/ directly
        # reports hundreds of phantom broken links on a project site.
        run: bash scripts/audit.sh

      - name: Accessibility report must be clean
        run: |
          python3 - <<'PY'
          import json, sys, pathlib
          # Derived from themes/ rather than named literally. Kinetic shipped
          # and deployed while this list still read apex/atlas/velocity, so
          # its report was generated and never once asserted on.
          themes = sorted(p.name for p in pathlib.Path("themes").iterdir() if p.is_dir())
          if not themes:
              sys.exit("no themes found under themes/")
          print(f"asserting on: {', '.join(themes)}")
          failed = False
          for theme in themes:
              p = pathlib.Path("public") / theme / "accessibility-report.json"
              # A theme that produced no report is a hole, not a pass.
              if not p.exists():
                  print(f"{theme}: MISSING {p}")
                  failed = True
                  continue
              data = json.loads(p.read_text())
              issues = data.get("total_issues", -1)
              print(f"{theme}: {issues} issue(s) across {data.get('pages_scanned')} page(s)")
              if issues != 0:
                  failed = True
                  for page in data.get("pages", []):
                      print(f"  {page}")
          sys.exit(1 if failed else 0)
          PY

      # Four suites, all through the same pinned Chromium: layout across 13
      # viewports x 2 schemes, keyboard/zoom/reduced-motion/forced-colours,
      # screen-reader + print + degraded delivery, and axe-core WCAG 2.2 AA.
      # axe runs here rather than via @axe-core/cli because the CLI drives
      # the runner's system Chrome through ChromeDriver, and the two drift:
      # it failed all 25 pages with "This version of ChromeDriver only
      # supports Chrome version 151".
      - name: Install browser test dependencies
        # `npm ci` installs exactly what package-lock.json records, with
        # integrity hashes; `npm install` could rewrite the lockfile.
        run: |
          npm --prefix tests/responsive ci --no-audit --no-fund
          npx --prefix tests/responsive playwright install --with-deps chromium

      - name: Browser gates (layout, interaction, semantics, axe)
        # Single pass, for the reason given on the AAA step below.
        env:
          RESPONSIVE_BATCHES: "1"
        run: |
          bash tests/responsive/run.sh

      # The AAA suites measure what the browser paints, which the stylesheet
      # gates above cannot: a token can pass in isolation and still be
      # rendered on a ground it was never paired with. Reuses the Chromium
      # installed by the step above.
      - name: AAA gates (rendered contrast, target size, reflow, focus)
        # Keep the runner's default bounded batches. A single Chromium over
        # all 264 pages accumulates enough renderer state to exit 1 late in
        # the focus suite; restarting between groups is part of the gate's
        # memory-safety contract, not merely a developer-machine workaround.
        run: bash tests/aaa/run.sh

      - name: Install link checker
        run: npm install --no-save linkinator

      # The site is served from the root of its own host, so `public/` is
      # the document root. When it lived at a path, this had to serve a
      # mirrored tree or every root-absolute URL 404'd and linkinator
      # reported 57 phantom broken links.
      - name: Serve the site
        run: |
          npx --yes http-server public -p 8080 --silent &
          npx --yes wait-on http://127.0.0.1:8080/ -t 60000

      - name: Broken link check
        run: |
          npx linkinator "http://127.0.0.1:8080/" \
            --recurse --silent --skip "^https?://(?!127\.0\.0\.1)"

      # Informational only, and deliberately so: README.md states this
      # project ships no Lighthouse score badge, so there is no claim here
      # for a gate to defend. The report is uploaded for humans to read.
      - name: pa11y (axe + htmlcs, WCAG2AAA, every built page)
        run: |
          # The install used to sit in quality-gate.yml, which never ran the
          # tool it installed. It belongs next to the step that uses it.
          npm install -g pa11y-ci
          bash scripts/pa11y.sh

      - name: Lighthouse CI
        run: |
          npm install --no-save @lhci/cli
          # The thresholds live in .lighthouserc.json so a local
          # `make check-lighthouse` and CI assert exactly the same thing —
          # both mobile and desktop run three times and hard-gate all four
          # categories at 1.0, with the transfer and raw-metric budgets too.
          bash scripts/lighthouse.sh

  deploy:
    needs: gate
    # `inputs.ssg_version` is empty for push and dispatch, and set only for
    # a probe called by ssg-version.yml, which gates but must never publish.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.ssg_version == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: public
          path: public

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
